[project]
name = "pepkio-elisa-plate-mapper"
version = "0.1.0"
description = "Python client for Pepkio elisa-plate-mapper tool"
readme = "README_PYPI.md"
requires-python = ">=3.10"
dependencies = [
    "click>=8.0.0",
    "httpx>=0.24.0",
    "pydantic>=2.0.0",
]

[project.scripts]
pepkio-elisa-plate-mapper = "pepkio_elisa_plate_mapper.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pepkio_elisa_plate_mapper"]

[dependency-groups]
dev = [
    "hatchling>=1.30.1",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "python-dotenv>=1.0.0",
    "ruff>=0.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
